quarkus.application.name=prompt-library

# ============================================================
# Database + Flyway (Flyway owns the schema, Hibernate never changes it)
# ============================================================
quarkus.datasource.db-kind=mysql
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=none

# ============================================================
# Security
# ============================================================
# Every REST method needs an explicit annotation (@Authenticated, @RolesAllowed, @PermitAll)
quarkus.security.jaxrs.deny-unannotated-endpoints=true
# This app is a "resource server": it only validates bearer tokens issued by Keycloak
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path=realm_access/roles

# ============================================================
# OpenAPI / Swagger UI  ->  /q/openapi  and  /q/swagger-ui
# ============================================================
quarkus.smallrye-openapi.info-title=Prompt Library API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Learning project: Quarkus + Flyway + Panache + Keycloak
quarkus.smallrye-openapi.security-scheme=jwt
# Writes openapi.yaml / openapi.json at build time into target/openapi
quarkus.smallrye-openapi.store-schema-directory=target/openapi
# Swagger UI is dev-only by default; uncomment to keep it in packaged builds
#quarkus.swagger-ui.always-include=true

# ============================================================
# App settings
# ============================================================
app.seed.enabled=false
app.keycloak.base-url=http://localhost:8180
app.keycloak.realm=prompt-library
app.keycloak.client-id=prompt-library-api
app.keycloak.client-secret=dev-secret-change-me

# ============================================================
# %dev  -> docker compose (MySQL :3306 + Keycloak :8180), Dev Services OFF
# ============================================================
%dev.quarkus.devservices.enabled=false
%dev.quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/promptlib
%dev.quarkus.datasource.username=promptlib
%dev.quarkus.datasource.password=promptlib
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.oidc.auth-server-url=http://localhost:8180/realms/prompt-library
%dev.quarkus.oidc.client-id=prompt-library-api
%dev.quarkus.oidc.connection-delay=30S
%dev.app.seed.enabled=true

# ============================================================
# %test -> NOTHING configured on purpose: Quarkus Dev Services starts throwaway
#          MySQL + Keycloak containers for the tests (Docker required).
# ============================================================

# ============================================================
# %staging -> your already running DB / Keycloak
#   run with:  ./mvnw quarkus:dev -Dquarkus.profile=staging
#   (secrets come from environment variables)
# ============================================================
%staging.quarkus.datasource.jdbc.url=${DB_URL}
%staging.quarkus.datasource.username=${DB_USER}
%staging.quarkus.datasource.password=${DB_PASSWORD}
%staging.quarkus.oidc.auth-server-url=${OIDC_URL}
%staging.quarkus.oidc.client-id=${OIDC_CLIENT_ID:prompt-library-api}
%staging.app.keycloak.base-url=${KEYCLOAK_BASE_URL}
%staging.app.keycloak.realm=${KEYCLOAK_REALM:prompt-library}
%staging.app.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
# Once everything runs, try: make Hibernate verify entities match the Flyway schema
#%staging.quarkus.hibernate-orm.schema-management.strategy=validate

# ============================================================
# %prod -> same idea as staging (packaged jar: java -jar target/quarkus-app/quarkus-run.jar)
# ============================================================
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.oidc.auth-server-url=${OIDC_URL}
%prod.quarkus.oidc.client-id=${OIDC_CLIENT_ID:prompt-library-api}
%prod.app.keycloak.base-url=${KEYCLOAK_BASE_URL}
%prod.app.keycloak.realm=${KEYCLOAK_REALM:prompt-library}
%prod.app.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
