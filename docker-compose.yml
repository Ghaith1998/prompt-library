services:
  mysql:
    image: mysql:8.4
    container_name: promptlib-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: promptlib
      MYSQL_USER: promptlib
      MYSQL_PASSWORD: promptlib
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    # If this tag is not found, pick a current 26.x tag from https://quay.io/repository/keycloak/keycloak
    image: quay.io/keycloak/keycloak:26.4
    container_name: promptlib-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      # Realm is imported on first start (skipped if the realm already exists).
      # No data volume on purpose: `docker compose down` => fresh, reproducible Keycloak.
      - ./keycloak/import:/opt/keycloak/data/import:ro

volumes:
  mysql_data:
